trigger: none

schedules:
  - cron: "0 0,13 * * *"
    displayName: Twice daily build and run System Tests
    branches:
      include:
      - master

pr: none

# Every dependency of the tests runs in a container on the build agent (see test-pipeline-sql-server.yml and
# test-pipeline-azurite.yml), so no Azure resources, and no secrets, are needed.
variables:
  - name: RUN_CI_PERF_TESTS_OFF
    value: 'This will get defined as an Environment Variable, which will enable various Perf-Test-only tests. See IgnoreExceptOnCiPerfTestAttribute.cs'
  # SQL Server runs in a container on each agent, so this password never leaves the agent.
  - name: sqlSaPassword
    value: 'Atlas-System-Tests-1'
  - name: sqlServerConnection
    value: 'Server=localhost,1433;User ID=sa;Password=$(sqlSaPassword);MultipleActiveResultSets=True;TrustServerCertificate=True;'

jobs:
- job: Matching_Algorithm_Integration_Tests
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - template: test-pipeline-sql-server.yml
  - task: DotNetCoreCLI@2
    displayName: 'Nuget Restore'
    inputs:
      command: 'restore'
      feedsToUse: 'select'
  # A and B must be different databases: some tests check that the active database is left alone while the dormant one changes.
  - task: bendayconsulting.build-task.setjsonconfigconnectionstring.setjsonconfigconnectionstring@1
    displayName: 'Update connection string ''SqlA'''
    inputs:
      filename: '$(System.DefaultWorkingDirectory)/Atlas.MatchingAlgorithm.Test.Integration/appsettings.json'
      keyname: SqlA
      connectionstringvalue: '$(sqlServerConnection)Initial Catalog=AtlasMatchingIntegrationTests;'

  - task: bendayconsulting.build-task.setjsonconfigconnectionstring.setjsonconfigconnectionstring@1
    displayName: 'Update connection string ''SqlB'''
    inputs:
      filename: '$(System.DefaultWorkingDirectory)/Atlas.MatchingAlgorithm.Test.Integration/appsettings.json'
      keyname: SqlB
      connectionstringvalue: '$(sqlServerConnection)Initial Catalog=AtlasMatchingIntegrationTestsB;'

  - task: bendayconsulting.build-task.setjsonconfigconnectionstring.setjsonconfigconnectionstring@1
    displayName: 'Update connection string ''PersistentSql'' '
    inputs:
      filename: '$(System.DefaultWorkingDirectory)/Atlas.MatchingAlgorithm.Test.Integration/appsettings.json'
      keyname: PersistentSql
      connectionstringvalue: '$(sqlServerConnection)Initial Catalog=AtlasSystemTests;'
  - task: DotNetCoreCLI@2
    displayName: 'Matching Integration Tests'
    inputs:
      command: test
      projects: '$(System.DefaultWorkingDirectory)/Atlas.MatchingAlgorithm.Test.Integration/Atlas.MatchingAlgorithm.Test.Integration.csproj'
      arguments: '--no-restore -v d'
      testRunTitle: 'Matching Algorithm Integration Tests'

- job: Matching_Algorithm_Validation_Tests
  # The scenarios run one at a time within a process, so they are split across agents instead.
  # Each shard has its own SQL Server, and sets up its own test data.
  strategy:
    matrix:
      AdultSearch:
        validationTestFilter: 'FullyQualifiedName~.ValidationTests.Features.AdultSearch.'
        validationShard: 'AdultSearch'
      Scoring:
        validationTestFilter: 'FullyQualifiedName~.ValidationTests.Features.Scoring.'
        validationShard: 'Scoring'
      Other:
        validationTestFilter: 'FullyQualifiedName!~.ValidationTests.Features.AdultSearch.&FullyQualifiedName!~.ValidationTests.Features.Scoring.'
        validationShard: 'Other'
  variables:
    matching_algorithm_validation_db_connection_string: '$(sqlServerConnection)Initial Catalog=AtlasMatchingValidationTests;'
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - task: UseDotNet@2
    displayName: 'Use .Net sdk'
    inputs:
      version: 8.0.x

  - task: UseDotNet@2
    displayName: 'Use .Net sdk'
    inputs:
      version: 10.0.x

  - template: test-pipeline-sql-server.yml

  - task: DotNetCoreCLI@2
    displayName: 'Nuget Restore'
    inputs:
      command: 'restore'
      feedsToUse: 'select'

  - task: bendayconsulting.build-task.setjsonconfigconnectionstring.setjsonconfigconnectionstring@1
    displayName: 'Update connection string ''DonorSql'''
    inputs:
      filename: '$(System.DefaultWorkingDirectory)/Atlas.MatchingAlgorithm.Test.Validation/appsettings.json'
      keyname: DonorSql
      connectionstringvalue: '$(matching_algorithm_validation_db_connection_string)'

  - task: bendayconsulting.build-task.setjsonconfigconnectionstring.setjsonconfigconnectionstring@1
    displayName: 'Update connection string ''SqlA'''
    inputs:
      filename: '$(System.DefaultWorkingDirectory)/Atlas.MatchingAlgorithm.Test.Validation/appsettings.json'
      keyname: SqlA
      connectionstringvalue: '$(matching_algorithm_validation_db_connection_string)'

  - task: bendayconsulting.build-task.setjsonconfigconnectionstring.setjsonconfigconnectionstring@1
    displayName: 'Update connection string ''SqlB'''
    inputs:
      filename: '$(System.DefaultWorkingDirectory)/Atlas.MatchingAlgorithm.Test.Validation/appsettings.json'
      keyname: SqlB
      connectionstringvalue: '$(matching_algorithm_validation_db_connection_string)'

  - task: bendayconsulting.build-task.setjsonconfigconnectionstring.setjsonconfigconnectionstring@1
    displayName: 'Update connection string ''PersistentSql'' '
    inputs:
      filename: '$(System.DefaultWorkingDirectory)/Atlas.MatchingAlgorithm.Test.Validation/appsettings.json'
      keyname: PersistentSql
      connectionstringvalue: '$(matching_algorithm_validation_db_connection_string)'

  - task: DotNetCoreCLI@2
    displayName: 'Matching Validation Tests'
    inputs:
      command: test
      projects: '$(System.DefaultWorkingDirectory)/Atlas.MatchingAlgorithm.Test.Validation/Atlas.MatchingAlgorithm.Test.Validation.csproj'
      arguments: '--no-restore -v d --filter "$(validationTestFilter)"'
      testRunTitle: 'Matching Algorithm Validation Tests - $(validationShard)'

- job: Donor_Import_Integration_Tests
  pool:
    vmImage: 'ubuntu-latest'
  steps:
    - template: test-pipeline-sql-server.yml
    - task: DotNetCoreCLI@2
      displayName: 'Nuget Restore'
      inputs:
        command: 'restore'
        feedsToUse: 'select'
    - task: bendayconsulting.build-task.setjsonconfigconnectionstring.setjsonconfigconnectionstring@1
      displayName: 'Update Sql connection string'
      inputs:
        filename: '$(System.DefaultWorkingDirectory)/Atlas.DonorImport.Test.Integration/appsettings.json'
        keyname: DonorStoreSql
        connectionstringvalue: '$(sqlServerConnection)Initial Catalog=AtlasSystemTests;'

    - task: DotNetCoreCLI@2
      displayName: 'Donor Import Integration Tests'
      inputs:
        command: test
        projects: '$(System.DefaultWorkingDirectory)/Atlas.DonorImport.Test.Integration/Atlas.DonorImport.Test.Integration.csproj'
        arguments: '--no-restore -v d'
        testRunTitle: 'Donor Import Integration Tests'
- job: Match_Prediction_Integration_Tests
  pool:
    vmImage: 'ubuntu-latest'
  steps:
    - template: test-pipeline-sql-server.yml
    - task: DotNetCoreCLI@2
      displayName: 'Nuget Restore'
      inputs:
        command: 'restore'
        feedsToUse: 'select'
    - task: bendayconsulting.build-task.setjsonconfigconnectionstring.setjsonconfigconnectionstring@1
      displayName: 'Update Sql connection string'
      inputs:
        filename: '$(System.DefaultWorkingDirectory)/Atlas.MatchPrediction.Test.Integration/appsettings.json'
        keyname: MatchPredictionSql
        connectionstringvalue: '$(sqlServerConnection)Initial Catalog=AtlasSystemTests;'
    - task: DotNetCoreCLI@2
      displayName: 'MPA Integration Tests'
      inputs:
        command: test
        projects: '$(System.DefaultWorkingDirectory)/Atlas.MatchPrediction.Test.Integration/Atlas.MatchPrediction.Test.Integration.csproj'
        arguments: '--no-restore -v d'
        testRunTitle: 'Match Prediction Integration Tests'
- job: Multiple_Allele_Code_Dictionary_Integration_Tests
  pool:
    vmImage: 'ubuntu-latest'
  steps:
    # The tests' default storage connection string, "UseDevelopmentStorage=true", points at Azurite.
    - template: test-pipeline-azurite.yml
    - task: DotNetCoreCLI@2
      displayName: 'Nuget Restore'
      inputs:
        command: 'restore'
        feedsToUse: 'select'
    - task: DotNetCoreCLI@2
      displayName: 'MacDictionary Integration Tests'
      inputs:
        command: test
        projects: '$(System.DefaultWorkingDirectory)/Atlas.MultipleAlleleCodeDictionary.Test.Integration/Atlas.MultipleAlleleCodeDictionary.Test.Integration.csproj'
        arguments: '--no-restore -v d'
        testRunTitle: 'MAC Dictionary Integration Tests'
