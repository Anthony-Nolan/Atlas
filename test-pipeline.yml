trigger: none

schedules:
  - cron: "0 0,13 * * *"
    displayName: Twice daily build and run System Tests
    branches:
      include:
      - master

pr: none

parameters:
  # Their build output is published by the Build stage, in the "SystemTests" artifact, in a folder named after the project.
  - name: testProjects
    type: object
    default:
      - Atlas.MatchingAlgorithm.Test.Integration
      - Atlas.MatchingAlgorithm.Test.Validation
      - Atlas.DonorImport.Test.Integration
      - Atlas.MatchPrediction.Test.Integration
      - Atlas.MultipleAlleleCodeDictionary.Test.Integration

# Every dependency of the tests runs in a container on the build agent (see test-pipeline-dependencies.yml),
# so no Azure resources, and no secrets, are needed.
variables:
  - name: RUN_CI_PERF_TESTS_OFF
    value: 'This will get defined as an Environment Variable, which will enable various Perf-Test-only tests. See IgnoreExceptOnCiPerfTestAttribute.cs'
  # SQL Server runs in a container on each agent, so this password never leaves the agent.
  - name: sqlSaPassword
    value: 'Atlas-System-Tests-1'
  - name: sqlServerConnection
    value: 'Server=localhost,1433;User ID=sa;Password=$(sqlSaPassword);MultipleActiveResultSets=True;TrustServerCertificate=True;'

stages:
- stage: Build
  jobs:
  - job: Build
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: UseDotNet@2
      displayName: 'Use .Net sdk'
      inputs:
        version: 8.0.x
    - task: UseDotNet@2
      displayName: 'Use .Net sdk'
      inputs:
        version: 10.0.x
    - script: dotnet build Atlas.slnx
      displayName: 'Build Atlas'
    # The test projects do not all build to the same folder, so MSBuild is asked where each one did.
    - bash: |
        for project in ${{ join(' ', parameters.testProjects) }}; do
          outputFolder=$(dotnet msbuild "$project/$project.csproj" -getProperty:TargetDir)
          cp -r "$outputFolder" "$(Build.ArtifactStagingDirectory)/$project"
        done
      displayName: 'Collect test projects'
    - publish: '$(Build.ArtifactStagingDirectory)'
      artifact: SystemTests
      displayName: 'Publish test projects'

# Each job runs its tests against its own SQL Server and Azurite (see test-pipeline-dependencies.yml).
# Connection strings are passed as environment variables, which override the local defaults in each project's appsettings.json.
- stage: Test
  dependsOn: Build
  jobs:
  - job: Matching_Algorithm_Integration_Tests
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - template: test-pipeline-run-tests.yml
      parameters:
        project: Atlas.MatchingAlgorithm.Test.Integration
        testRunTitle: 'Matching Algorithm Integration Tests'
        env:
          # A and B must be different databases: some tests check that the active database is left alone while the dormant one changes.
          ConnectionStrings__SqlA: '$(sqlServerConnection)Initial Catalog=AtlasMatchingIntegrationTests;'
          ConnectionStrings__SqlB: '$(sqlServerConnection)Initial Catalog=AtlasMatchingIntegrationTestsB;'
          ConnectionStrings__PersistentSql: '$(sqlServerConnection)Initial Catalog=AtlasSystemTests;'

  - job: Matching_Algorithm_Validation_Tests
    # The scenarios run one at a time within a process, so they are split across agents instead.
    # Each shard has its own SQL Server, and sets up its own test data.
    strategy:
      matrix:
        AdultSearch:
          validationTestFilter: 'FullyQualifiedName~.ValidationTests.Features.AdultSearch.'
          validationShard: 'AdultSearch'
        Scoring:
          validationTestFilter: 'FullyQualifiedName~.ValidationTests.Features.Scoring.'
          validationShard: 'Scoring'
        Other:
          validationTestFilter: 'FullyQualifiedName!~.ValidationTests.Features.AdultSearch.&FullyQualifiedName!~.ValidationTests.Features.Scoring.'
          validationShard: 'Other'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - template: test-pipeline-run-tests.yml
      parameters:
        project: Atlas.MatchingAlgorithm.Test.Validation
        testRunTitle: 'Matching Algorithm Validation Tests - $(validationShard)'
        filter: '$(validationTestFilter)'
        env:
          ConnectionStrings__DonorSql: '$(sqlServerConnection)Initial Catalog=AtlasMatchingValidationTests;'
          ConnectionStrings__SqlA: '$(sqlServerConnection)Initial Catalog=AtlasMatchingValidationTests;'
          ConnectionStrings__SqlB: '$(sqlServerConnection)Initial Catalog=AtlasMatchingValidationTests;'
          ConnectionStrings__PersistentSql: '$(sqlServerConnection)Initial Catalog=AtlasMatchingValidationTests;'

  - job: Donor_Import_Integration_Tests
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - template: test-pipeline-run-tests.yml
      parameters:
        project: Atlas.DonorImport.Test.Integration
        testRunTitle: 'Donor Import Integration Tests'
        env:
          ConnectionStrings__DonorStoreSql: '$(sqlServerConnection)Initial Catalog=AtlasSystemTests;'

  - job: Match_Prediction_Integration_Tests
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - template: test-pipeline-run-tests.yml
      parameters:
        project: Atlas.MatchPrediction.Test.Integration
        testRunTitle: 'Match Prediction Integration Tests'
        env:
          ConnectionStrings__MatchPredictionSql: '$(sqlServerConnection)Initial Catalog=AtlasSystemTests;'

  - job: Multiple_Allele_Code_Dictionary_Integration_Tests
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - template: test-pipeline-run-tests.yml
      parameters:
        project: Atlas.MultipleAlleleCodeDictionary.Test.Integration
        testRunTitle: 'MAC Dictionary Integration Tests'
