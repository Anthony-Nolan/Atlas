trigger:
  - master

variables:
  - group: Terraform
  # SQL Server runs in a container on each integration test agent, so this password never leaves the agent.
  - name: sqlSaPassword
    value: 'Atlas-System-Tests-1'
  - name: sqlServerConnection
    value: 'Server=localhost,1433;User ID=sa;Password=$(sqlSaPassword);MultipleActiveResultSets=True;TrustServerCertificate=True;'

pr: none

# Build and Build Tests run in parallel; Unit Tests and Integration Tests run the test projects that Build Tests built, in parallel.
# Publish pushes the images only once the build and every test have succeeded.
stages:
- stage: Build
  jobs:
  - job: Build
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - task: UseDotNet@2
        inputs:
          packageType: 'sdk'
          version: '8.0.x'

      - task: UseDotNet@2
        inputs:
          packageType: 'sdk'
          version: '10.0.x'

      - task: DotNetCoreCLI@2
        displayName: Install dotnet-ef
        inputs:
          command: 'custom'
          custom: 'tool'
          arguments: 'install dotnet-ef --global --ignore-failed-sources --version "8.0.*"'

      - task: DotNetCoreCLI@2
        displayName: 'Restore'
        inputs:
          command: 'restore'
          feedsToUse: 'select'

      - task: DotNetCoreCLI@2
        displayName: 'Build Projects'
        inputs:
          command: 'build'
          projects: |
            Atlas.Client.Models
            Atlas.Common.Public.Models
            Atlas.Functions
            Atlas.Functions.PublicApi
            Atlas.DonorImport.Data
            Atlas.DonorImport.FileSchema.Models
            Atlas.DonorImport.Functions
            Atlas.MatchingAlgorithm.Client.Models
            Atlas.MatchingAlgorithm.Functions
            Atlas.MatchingAlgorithm.Functions.DonorManagement
            Atlas.MatchingAlgorithm.Functions.DataRefresh
            Atlas.MatchingAlgorithm.Data
            Atlas.MatchingAlgorithm.Data.Persistent
            Atlas.MatchPrediction.Data
            Atlas.MatchPrediction.Functions
            Atlas.RepeatSearch.Data
            Atlas.RepeatSearch.Functions
            Atlas.SearchTracking.Data
            Atlas.SearchTracking.Functions
          arguments: '--configuration Release --no-restore'

      - task: DotNetCoreCLI@2
        displayName: 'Pack API Client Packages'
        inputs:
          command: pack
          packagesToPack: '**/Atlas.Client.Models.csproj;**/Atlas.MatchingAlgorithm.Client.Models.csproj;**/Atlas.DonorImport.FileSchema.Models.csproj;**/Atlas.Common.Public.Models.csproj'
          packDirectory: '$(Build.ArtifactStagingDirectory)/published-models'
          nobuild: true

      - task: PublishBuildArtifacts@1
        displayName: 'Publish API Client Packages'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)/published-models'
          ArtifactName: published-models

      - task: VersionReaderTask@3
        displayName: 'Read Atlas Version'
        inputs:
          searchPattern: '**/Atlas.Functions.PublicApi.csproj'
          variablesPrefix: Atlas

      - task: file-creator@7
        displayName: 'Create version.txt'
        inputs:
          filepath: '$(Build.ArtifactStagingDirectory)/metadata/version.txt'
          filecontent: '$(Atlas_VersionPrefix)'
          fileoverwrite: true

      - task: file-creator@7
        displayName: 'Create commitSha.txt'
        inputs:
          filepath: '$(Build.ArtifactStagingDirectory)/metadata/commitSha.txt'
          filecontent: '$(Build.SourceVersion)'
          fileoverwrite: true

      - task: PublishBuildArtifacts@1
        displayName: 'Publish Artifact: Metadata'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)/metadata'
          ArtifactName: atlas-metadata

        # Suffix version number with build ID to allow for a prerelease ci (continuous integration) packages to be published
      - bash: dotnet pack **/Atlas.Client.Models.csproj --output $(Build.ArtifactStagingDirectory)/published-models-ci --no-build --version-suffix "ci-$(Build.BuildId)"
        displayName: Pack Prerelease Client Models

      - bash: dotnet pack **/Atlas.MatchingAlgorithm.Client.Models.csproj --output $(Build.ArtifactStagingDirectory)/published-models-ci --no-build --version-suffix "ci-$(Build.BuildId)"
        displayName: Pack Prerelease Matching Algorithm Client Models

      - bash: dotnet pack **/Atlas.DonorImport.FileSchema.Models.csproj --output $(Build.ArtifactStagingDirectory)/published-models-ci --no-build --version-suffix "ci-$(Build.BuildId)"
        displayName: Pack Prerelease Donor Import File Schema Models

      - bash: dotnet pack **/Atlas.Common.Public.Models.csproj --output $(Build.ArtifactStagingDirectory)/published-models-ci --no-build --version-suffix "ci-$(Build.BuildId)"
        displayName: Pack Prerelease Common Public Models

      - task: PublishBuildArtifacts@1
        displayName: 'Publish Artifact: Published Models-CI'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)/published-models-ci'
          ArtifactName: published-models-ci

      - task: CopyFiles@2
        displayName: 'Copy Atlas Functions Build'
        inputs:
          SourceFolder: 'Atlas.Functions'
          Contents: |
            bin/**
            *.config
          TargetFolder: 'atlasFunctionsBuild'
      - task: ArchiveFiles@2
        displayName: 'Archive Atlas Functions Build'
        inputs:
          rootFolderOrFile: '$(System.DefaultWorkingDirectory)/atlasFunctionsBuild/bin'
          includeRootFolder: false
          archiveFile: '$(Build.ArtifactStagingDirectory)/AtlasFunctions-$(Build.BuildId).zip'
      - task: PublishBuildArtifacts@1
        displayName: 'Publish Artifact: Atlas Functions'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)/AtlasFunctions-$(Build.BuildId).zip'
          ArtifactName: functions

      - task: CopyFiles@2
        displayName: 'Copy Atlas Public Api Functions Build'
        inputs:
          SourceFolder: 'Atlas.Functions.PublicApi'
          Contents: |
            bin/**
            *.config
          TargetFolder: 'atlasPublicApiBuild'
      - task: ArchiveFiles@2
        displayName: 'Archive Atlas Public Api Functions Build'
        inputs:
          rootFolderOrFile: '$(System.DefaultWorkingDirectory)/atlasPublicApiBuild/bin'
          includeRootFolder: false
          archiveFile: '$(Build.ArtifactStagingDirectory)/AtlasPublicApiFunctions-$(Build.BuildId).zip'
      - task: PublishBuildArtifacts@1
        displayName: 'Publish Artifact: Atlas Functions'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)/AtlasPublicApiFunctions-$(Build.BuildId).zip'
          ArtifactName: functions

      - task: CopyFiles@2
        displayName: 'Copy MatchingAlgorithm Functions Build'
        inputs:
          SourceFolder: 'Atlas.MatchingAlgorithm.Functions'
          Contents: |
            bin/**
            *.config
          TargetFolder: 'matchingFunctionsBuild'
      - task: ArchiveFiles@2
        displayName: 'Archive MatchingAlgorithm Functions Build'
        inputs:
          rootFolderOrFile: '$(System.DefaultWorkingDirectory)/matchingFunctionsBuild/bin'
          includeRootFolder: false
          archiveFile: '$(Build.ArtifactStagingDirectory)/MatchingFunctions-$(Build.BuildId).zip'
      - task: PublishBuildArtifacts@1
        displayName: 'Publish Artifact: MatchingAlgorithm Functions'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)/MatchingFunctions-$(Build.BuildId).zip'
          ArtifactName: functions

      - task: CopyFiles@2
        displayName: 'Copy DonorManagement Functions Build'
        inputs:
          SourceFolder: 'Atlas.MatchingAlgorithm.Functions.DonorManagement'
          Contents: |
            bin/**
            *.config
          TargetFolder: 'matchingDonorFunctionsBuild'
      - task: ArchiveFiles@2
        displayName: 'Archive Matching Algorithm DonorManagement Functions Build'
        inputs:
          rootFolderOrFile: '$(System.DefaultWorkingDirectory)/matchingDonorFunctionsBuild/bin'
          includeRootFolder: false
          archiveFile: '$(Build.ArtifactStagingDirectory)/MatchingDonorFunctions-$(Build.BuildId).zip'
      - task: PublishBuildArtifacts@1
        displayName: 'Publish Artifact: DonorManagement Functions'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)/MatchingDonorFunctions-$(Build.BuildId).zip'
          ArtifactName: functions

      - task: CopyFiles@2
        displayName: 'Copy DataRefresh Functions Build'
        inputs:
          SourceFolder: 'Atlas.MatchingAlgorithm.Functions.DataRefresh'
          Contents: |
            bin/**
            *.config
          TargetFolder: 'matchingDataRefreshFunctionsBuild'
      - task: ArchiveFiles@2
        displayName: 'Archive Matching Algorithm DataRefresh Functions Build'
        inputs:
          rootFolderOrFile: '$(System.DefaultWorkingDirectory)/matchingDataRefreshFunctionsBuild/bin'
          includeRootFolder: false
          archiveFile: '$(Build.ArtifactStagingDirectory)/MatchingDataRefreshFunctions-$(Build.BuildId).zip'
      - task: PublishBuildArtifacts@1
        displayName: 'Publish Artifact: DataRefresh Functions'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)/MatchingDataRefreshFunctions-$(Build.BuildId).zip'
          ArtifactName: functions

      - task: CopyFiles@2
        displayName: 'Copy MatchPrediction Functions Build'
        inputs:
          SourceFolder: 'Atlas.MatchPrediction.Functions'
          Contents: |
            bin/**
            *.config
          TargetFolder: 'matchPredictionFunctionsBuild'
      - task: ArchiveFiles@2
        displayName: 'Archive MatchPrediction Functions Build'
        inputs:
          rootFolderOrFile: '$(System.DefaultWorkingDirectory)/matchPredictionFunctionsBuild/bin'
          includeRootFolder: false
          archiveFile: '$(Build.ArtifactStagingDirectory)/MatchPredictionFunctions-$(Build.BuildId).zip'
      - task: PublishBuildArtifacts@1
        displayName: 'Publish Artifact: MatchPrediction Functions'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)/MatchPredictionFunctions-$(Build.BuildId).zip'
          ArtifactName: functions

      - task: CopyFiles@2
        displayName: 'Copy DonorImport Functions Build'
        inputs:
          SourceFolder: 'Atlas.DonorImport.Functions'
          Contents: |
            bin/**
            *.config
          TargetFolder: 'donorImportFunctionsBuild'
      - task: ArchiveFiles@2
        displayName: 'Archive DonorImport Functions Build'
        inputs:
          rootFolderOrFile: '$(System.DefaultWorkingDirectory)/donorImportFunctionsBuild/bin'
          includeRootFolder: false
          archiveFile: '$(Build.ArtifactStagingDirectory)/DonorImportFunctions-$(Build.BuildId).zip'
      - task: PublishBuildArtifacts@1
        displayName: 'Publish Artifact: DonorImport Functions'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)/DonorImportFunctions-$(Build.BuildId).zip'
          ArtifactName: functions

      - task: CopyFiles@2
        displayName: 'Copy RepeatSearch Functions Build'
        inputs:
          SourceFolder: 'Atlas.RepeatSearch.Functions'
          Contents: |
            bin/**
            *.config
          TargetFolder: 'repeatSearchFunctionsBuild'
      - task: ArchiveFiles@2
        displayName: 'Archive RepeatSearch Functions Build'
        inputs:
          rootFolderOrFile: '$(System.DefaultWorkingDirectory)/repeatSearchFunctionsBuild/bin'
          includeRootFolder: false
          archiveFile: '$(Build.ArtifactStagingDirectory)/RepeatSearchFunctions-$(Build.BuildId).zip'
      - task: PublishBuildArtifacts@1
        displayName: 'Publish Artifact: RepeatSearch Functions'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)/RepeatSearchFunctions-$(Build.BuildId).zip'
          ArtifactName: functions

      - task: CopyFiles@2
        displayName: 'Copy SearchTracking Functions Build'
        inputs:
          SourceFolder: 'Atlas.SearchTracking.Functions'
          Contents: |
            bin/**
            *.config
          TargetFolder: 'searchTrackingFunctionsBuild'
      - task: ArchiveFiles@2
        displayName: 'Archive SearchTracking Functions Build'
        inputs:
          rootFolderOrFile: '$(System.DefaultWorkingDirectory)/searchTrackingFunctionsBuild/bin'
          includeRootFolder: false
          archiveFile: '$(Build.ArtifactStagingDirectory)/SearchTrackingFunctions-$(Build.BuildId).zip'
      - task: PublishBuildArtifacts@1
        displayName: 'Publish Artifact: SearchTracking Functions'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)/SearchTrackingFunctions-$(Build.BuildId).zip'
          ArtifactName: functions

      - task: DotNetCoreCLI@2
        displayName: 'Generate MatchingAlgorithm Persistent Migration'
        inputs:
          command: custom
          custom: ef
          arguments: 'migrations script  --output $(Build.ArtifactStagingDirectory)/SQL/SearchAlgorithmPersistentMigrationScript.sql --context SearchAlgorithmPersistentContext --idempotent --startup-project  $(System.DefaultWorkingDirectory)/Atlas.MatchingAlgorithm.Data.Persistent --project $(System.DefaultWorkingDirectory)/Atlas.MatchingAlgorithm.Data.Persistent/Atlas.MatchingAlgorithm.Data.Persistent.csproj --verbose'
      - task: DotNetCoreCLI@2
        displayName: 'Generate MatchingAlgorithm Transient Migration'
        inputs:
          command: custom
          custom: ef
          arguments: 'migrations script  --output $(Build.ArtifactStagingDirectory)/SQL/SearchAlgorithmTransientMigrationScript.sql --context SearchAlgorithmContext --idempotent --startup-project  $(System.DefaultWorkingDirectory)/Atlas.MatchingAlgorithm.Data --project $(System.DefaultWorkingDirectory)/Atlas.MatchingAlgorithm.Data'
      - task: DotNetCoreCLI@2
        displayName: 'Generate MatchPrediction Migration'
        inputs:
          command: custom
          custom: ef
          arguments: 'migrations script  --output $(Build.ArtifactStagingDirectory)/SQL/MatchPredictionMigrationScript.sql --context MatchPredictionContext --idempotent --startup-project  $(System.DefaultWorkingDirectory)/Atlas.MatchPrediction.Data --project $(System.DefaultWorkingDirectory)/Atlas.MatchPrediction.Data'
      - task: DotNetCoreCLI@2
        displayName: 'Generate Donor Migration'
        inputs:
          command: custom
          custom: ef
          arguments: 'migrations script  --output $(Build.ArtifactStagingDirectory)/SQL/DonorImportMigrationScript.sql --context DonorContext --idempotent --startup-project  $(System.DefaultWorkingDirectory)/Atlas.DonorImport.Data --project $(System.DefaultWorkingDirectory)/Atlas.DonorImport.Data'
      - task: DotNetCoreCLI@2
        displayName: 'Generate Repeat Search Migration'
        inputs:
          command: custom
          custom: ef
          arguments: 'migrations script  --output $(Build.ArtifactStagingDirectory)/SQL/RepeatSearchMigrationScript.sql --context RepeatSearchContext --idempotent --startup-project  $(System.DefaultWorkingDirectory)/Atlas.RepeatSearch.Data --project $(System.DefaultWorkingDirectory)/Atlas.RepeatSearch.Data'
      - task: DotNetCoreCLI@2
        displayName: 'Generate Search Tracking Migration'
        inputs:
          command: custom
          custom: ef
          arguments: 'migrations script  --output $(Build.ArtifactStagingDirectory)/SQL/SearchTrackingMigrationScript.sql --context SearchTrackingContext --idempotent --startup-project  $(System.DefaultWorkingDirectory)/Atlas.SearchTracking.Data --project $(System.DefaultWorkingDirectory)/Atlas.SearchTracking.Data'
      - task: PublishBuildArtifacts@1
        displayName: 'Publish Artifact: sql'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)/SQL'
          ArtifactName: sql
  - job: Terraform_Core
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@0
        displayName: 'Use Terraform 1.16.5'
        inputs:
          terraformVersion: '1.16.5'
      - script: 'terraform init -reconfigure -backend-config="storage_account_name=$(BACKEND_STORAGE_ACCOUNT_NAME)" -backend-config="container_name=$(BACKEND_STORAGE_CONTAINER_NAME)" -backend-config="resource_group_name=$(BACKEND_RESOURCE_GROUP_NAME)"'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/core'
        displayName: 'terraform init'
        env:
          ARM_ACCESS_KEY: $(ARM_ACCESS_KEY)
      - script: |
          echo Validating the syntax

          terraform validate
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/core'
        displayName: 'terraform validate'
        env:
          ARM_ACCESS_KEY: $(ARM_ACCESS_KEY)
          ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      - bash: |
          echo Remove the .terraform directory before pushing

          rm -rf .terraform/
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/core'
        displayName: 'rm -rf .terraform/'
      - task: PublishBuildArtifacts@1
        displayName: 'Publish Artifact: terraform-core'
        inputs:
          PathtoPublish: '$(System.DefaultWorkingDirectory)/terraform/core'
          ArtifactName: 'terraform-atlas-core'

- stage: Build_Tests
  displayName: 'Build Tests'
  dependsOn: []
  jobs:
  - job: Build_Tests
    pool:
      vmImage: 'ubuntu-latest'
    variables:
      integrationTestProjects: >-
        Atlas.MatchingAlgorithm.Test.Integration
        Atlas.MatchingAlgorithm.Test.Validation
        Atlas.DonorImport.Test.Integration
        Atlas.MatchPrediction.Test.Integration
        Atlas.MultipleAlleleCodeDictionary.Test.Integration
    steps:
    - checkout: self
      fetchDepth: 1
    - task: UseDotNet@2
      displayName: 'Use .Net sdk'
      inputs:
        version: 10.0.x
    # The unit test projects are every *.Test project.
    - bash: |
        unitTestProjects=$(ls -d */*Test.csproj | cut -d/ -f1 | tr '\n' ' ')
        echo "##vso[task.setvariable variable=unitTestProjects]$unitTestProjects"
      displayName: 'Find unit test projects'
    # Only the test projects, and what they reference, in one build, so that MSBuild builds them in parallel.
    - bash: |
        dotnet new sln --name Tests --format slnx
        for project in $(unitTestProjects) $(integrationTestProjects); do
          dotnet sln Tests.slnx add "$project/$project.csproj"
        done
        dotnet restore Tests.slnx -p:RestoreUseStaticGraphEvaluation=true
        dotnet build Tests.slnx --no-restore -p:RunAnalyzersDuringBuild=false
      displayName: 'Build test projects'
    # Published in the "Tests" artifact, in a "Unit" or an "Integration" folder, in a folder named after each project.
    # The test projects do not all build to the same folder, so MSBuild is asked where each one did.
    - bash: |
        collect() {
          for project in ${@:2}; do
            outputFolder=$(dotnet msbuild "$project/$project.csproj" -getProperty:TargetDir)
            mkdir -p "$(Build.ArtifactStagingDirectory)/$1"
            cp -r "$outputFolder" "$(Build.ArtifactStagingDirectory)/$1/$project"
          done
        }
        collect Unit $(unitTestProjects)
        collect Integration $(integrationTestProjects)
      displayName: 'Collect test projects'
    - publish: '$(Build.ArtifactStagingDirectory)'
      artifact: Tests
      displayName: 'Publish test projects'

- stage: Unit_Tests
  displayName: 'Unit Tests'
  dependsOn: Build_Tests
  jobs:
  - job: Unit_Tests
    # The HLA Metadata Dictionary tests take minutes, nearly all to generate the matched HLA their fixtures share,
    # so they run on their own agent, beside the other unit tests.
    strategy:
      matrix:
        # A variable cannot hold the several lines of an exclusion pattern, so the Other shard downloads every unit test project,
        # and leaves out the HLA Metadata Dictionary tests when it runs them.
        HlaMetadataDictionary:
          unitTestShard: 'HLA Metadata Dictionary'
          unitTestPattern: 'Unit/Atlas.HlaMetadataDictionary.Test/**'
          unitTestExcludedProject: ''
        Other:
          unitTestShard: 'Other'
          unitTestPattern: 'Unit/**'
          unitTestExcludedProject: 'Atlas.HlaMetadataDictionary.Test'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    # Some unit tests read files from the repository: the approval tests their approved files, next to their sources,
    # and the dependency injection tests the function apps' settings templates, from the repository root above them.
    # So the repository is checked out where the Build Tests stage built it, and the test projects are downloaded into it.
    - checkout: self
      fetchDepth: 1
    - task: UseDotNet@2
      displayName: 'Use .Net sdk'
      inputs:
        version: 10.0.x
    - task: DownloadPipelineArtifact@2
      displayName: 'Download unit test projects'
      inputs:
        artifact: Tests
        patterns: '$(unitTestPattern)'
        targetPath: '$(Build.SourcesDirectory)/TestBuild'
    # Every unit test project of the shard in one run, each in its own test host, from its own build output.
    - bash: |
        testAssemblies=$(for folder in */; do
          project=${folder%/}
          if [ "$project" != "$EXCLUDED_PROJECT" ]; then echo "$project/$project.dll"; fi
        done)
        dotnet test $testAssemblies --logger trx --results-directory "$(Agent.TempDirectory)/TestResults" -- RunConfiguration.MaxCpuCount=0
      displayName: 'Unit Tests - $(unitTestShard)'
      workingDirectory: '$(Build.SourcesDirectory)/TestBuild/Unit'
      env:
        EXCLUDED_PROJECT: $(unitTestExcludedProject)
    - task: PublishTestResults@2
      displayName: 'Publish test results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '**/*.trx'
        searchFolder: '$(Agent.TempDirectory)/TestResults'
        testRunTitle: 'Unit Tests - $(unitTestShard)'

# Each job runs its tests against its own SQL Server, or Azurite, as it needs (see build-pipeline-run-tests.yml).
# Connection strings are passed as environment variables, which override the local defaults in each project's appsettings.json.
# To also run the performance tests, define a RUN_CI_PERF_TESTS variable (see IgnoreExceptOnCiPerfTestAttribute.cs).
- stage: Integration_Tests
  displayName: 'Integration Tests'
  dependsOn: Build_Tests
  jobs:
  - job: Matching_Algorithm_Integration_Tests
    # The tests share the state of their databases, so they cannot run in parallel within a process.
    # Instead, they are split across agents, by namespace, each shard with its own SQL Server.
    strategy:
      matrix:
        Search:
          matchingTestFilter: 'FullyQualifiedName~.IntegrationTests.Search.'
          matchingShard: 'Search'
        Matching:
          matchingTestFilter: 'FullyQualifiedName~.IntegrationTests.Matching.'
          matchingShard: 'Matching'
        Other:
          matchingTestFilter: 'FullyQualifiedName!~.IntegrationTests.Search.&FullyQualifiedName!~.IntegrationTests.Matching.'
          matchingShard: 'Other'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - template: build-pipeline-run-tests.yml
      parameters:
        project: Atlas.MatchingAlgorithm.Test.Integration
        testRunTitle: 'Matching Algorithm Integration Tests - $(matchingShard)'
        filter: '$(matchingTestFilter)'
        env:
          # A and B must be different databases: some tests check that the active database is left alone while the dormant one changes.
          ConnectionStrings__SqlA: '$(sqlServerConnection)Initial Catalog=AtlasMatchingIntegrationTests;'
          ConnectionStrings__SqlB: '$(sqlServerConnection)Initial Catalog=AtlasMatchingIntegrationTestsB;'
          ConnectionStrings__PersistentSql: '$(sqlServerConnection)Initial Catalog=AtlasSystemTests;'

  - job: Matching_Algorithm_Validation_Tests
    # The scenarios are split across agents, each shard with its own SQL Server, and its own copy of the test data.
    # Running them in parallel within one process does not help: the searches compete for the agent's few cores.
    # The shards take about a minute each; the 8/10 searches are moved out of AdultSearch to balance them.
    strategy:
      matrix:
        AdultSearch:
          validationTestFilter: 'FullyQualifiedName~.ValidationTests.Features.AdultSearch.&FullyQualifiedName!~.AdultSearch.EightOutOfTenSearch.'
          validationShard: 'AdultSearch'
        Scoring:
          validationTestFilter: 'FullyQualifiedName~.ValidationTests.Features.Scoring.'
          validationShard: 'Scoring'
        Other:
          validationTestFilter: '(FullyQualifiedName!~.ValidationTests.Features.AdultSearch.&FullyQualifiedName!~.ValidationTests.Features.Scoring.)|FullyQualifiedName~.AdultSearch.EightOutOfTenSearch.'
          validationShard: 'Other'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - template: build-pipeline-run-tests.yml
      parameters:
        project: Atlas.MatchingAlgorithm.Test.Validation
        testRunTitle: 'Matching Algorithm Validation Tests - $(validationShard)'
        filter: '$(validationTestFilter)'
        env:
          ConnectionStrings__DonorSql: '$(sqlServerConnection)Initial Catalog=AtlasMatchingValidationTests;'
          ConnectionStrings__SqlA: '$(sqlServerConnection)Initial Catalog=AtlasMatchingValidationTests;'
          ConnectionStrings__SqlB: '$(sqlServerConnection)Initial Catalog=AtlasMatchingValidationTests;'
          ConnectionStrings__PersistentSql: '$(sqlServerConnection)Initial Catalog=AtlasMatchingValidationTests;'

  - job: Donor_Import_Integration_Tests
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - template: build-pipeline-run-tests.yml
      parameters:
        project: Atlas.DonorImport.Test.Integration
        testRunTitle: 'Donor Import Integration Tests'
        env:
          ConnectionStrings__DonorStoreSql: '$(sqlServerConnection)Initial Catalog=AtlasSystemTests;'

  - job: Match_Prediction_Integration_Tests
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - template: build-pipeline-run-tests.yml
      parameters:
        project: Atlas.MatchPrediction.Test.Integration
        testRunTitle: 'Match Prediction Integration Tests'
        env:
          ConnectionStrings__MatchPredictionSql: '$(sqlServerConnection)Initial Catalog=AtlasSystemTests;'

  - job: Multiple_Allele_Code_Dictionary_Integration_Tests
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - template: build-pipeline-run-tests.yml
      parameters:
        project: Atlas.MultipleAlleleCodeDictionary.Test.Integration
        testRunTitle: 'MAC Dictionary Integration Tests'
        sqlServer: false
        azurite: true

# The images are built from the sources, in Docker, so this stage needs nothing from the Build stage.
- stage: Publish
  dependsOn:
  - Build
  - Unit_Tests
  - Integration_Tests
  jobs:
  - job: Docker_Images
    strategy:
      matrix:
        MatchPredictionWorker:
          imageRepository: 'atlas-match-prediction'
          dockerfile: 'Atlas.MatchPrediction.Worker/Dockerfile'
        MatchingPrecomputeWorker:
          imageRepository: 'atlas-matching-precompute'
          dockerfile: 'Atlas.MatchingAlgorithm.PrecomputeWorker/Dockerfile'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
      fetchDepth: 1
    - task: Docker@2
      displayName: 'Build and Push $(imageRepository) Image'
      inputs:
        command: 'buildAndPush'
        repository: '$(imageRepository)'
        buildContext: '$(System.DefaultWorkingDirectory)'
        dockerfile: '$(dockerfile)'
        containerRegistry: 'AN Container Registry-Atlas'
        tags: |
          $(Build.BuildNumber)
          latest
