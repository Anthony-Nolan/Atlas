# Starts the dependencies of the System Tests on the build agent, and waits until they are ready:
# - SQL Server: the Developer edition, which supports the ONLINE index operations used by the matching migrations.
#   The tests create and migrate their own databases, so an empty server is enough.
# - Azurite, the Azure Storage emulator: the tests' default "UseDevelopmentStorage=true" connection string points at it,
#   and they create their own tables.
steps:
  - bash: |
      docker run -d --name atlas-sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SQL_SA_PASSWORD" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest

      for attempt in $(seq 1 60); do
        if docker exec atlas-sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SQL_SA_PASSWORD" -Q "SELECT 1" -b > /dev/null 2>&1; then
          echo "SQL Server is ready"
          exit 0
        fi
        sleep 2
      done

      docker logs atlas-sql
      echo "##vso[task.logissue type=error]SQL Server did not accept queries within 2 minutes"
      exit 1
    displayName: 'Start SQL Server'
    env:
      SQL_SA_PASSWORD: $(sqlSaPassword)

  - bash: |
      docker run -d --name atlas-azurite -p 10000:10000 -p 10001:10001 -p 10002:10002 mcr.microsoft.com/azure-storage/azurite \
        azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck

      for attempt in $(seq 1 30); do
        if (echo > /dev/tcp/127.0.0.1/10002) 2> /dev/null; then
          echo "Azurite is ready"
          exit 0
        fi
        sleep 2
      done

      docker logs atlas-azurite
      echo "##vso[task.logissue type=error]Azurite did not start within a minute"
      exit 1
    displayName: 'Start Azurite'
