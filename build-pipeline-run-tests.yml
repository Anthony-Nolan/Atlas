# Builds and runs one integration or validation test project, against the dependencies it needs, started in containers on the build agent.
# The job builds its own test project rather than downloading it from another job, so that the build publishes no test artifact:
# the release pipeline downloads every artifact of the build.
parameters:
  # The test project: the folder, and the name, of its .csproj.
  - name: project
    type: string
  - name: testRunTitle
    type: string
  - name: filter
    type: string
    default: ''
  # Environment variables for the test run: connection strings that override the local defaults in appsettings.json.
  - name: env
    type: object
    default: {}
  # SQL Server, in its Developer edition, which supports the ONLINE index operations used by the matching migrations.
  # The tests create and migrate their own databases, so an empty server is enough.
  - name: sqlServer
    type: boolean
    default: true
  # Azurite, the Azure Storage emulator, which the tests' default "UseDevelopmentStorage=true" connection string points at.
  # The tests create their own tables.
  - name: azurite
    type: boolean
    default: false

steps:
  # The dependencies are pinned to versions, so that a new image cannot break the tests unannounced.
  # They are started first and waited for last, so that they start up while the repository is checked out and the tests build.
  - ${{ if parameters.sqlServer }}:
    - bash: docker run -d --name atlas-sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SQL_SA_PASSWORD" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
      displayName: 'Start SQL Server'
      env:
        SQL_SA_PASSWORD: $(sqlSaPassword)
  - ${{ if parameters.azurite }}:
    - bash: >
        docker run -d --name atlas-azurite -p 10000:10000 -p 10001:10001 -p 10002:10002 mcr.microsoft.com/azure-storage/azurite:3.37.0
        azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
      displayName: 'Start Azurite'

  - checkout: self
    fetchDepth: 1

  - task: UseDotNet@2
    displayName: 'Use .Net sdk'
    inputs:
      version: 10.0.x

  - bash: dotnet build ${{ parameters.project }} -p:RestoreUseStaticGraphEvaluation=true -p:RunAnalyzersDuringBuild=false
    displayName: 'Build ${{ parameters.project }}'

  - ${{ if parameters.sqlServer }}:
    - bash: |
        for attempt in $(seq 1 60); do
          if docker exec atlas-sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SQL_SA_PASSWORD" -Q "SELECT 1" -b > /dev/null 2>&1; then
            echo "SQL Server is ready"
            exit 0
          fi
          sleep 2
        done

        docker logs atlas-sql
        echo "##vso[task.logissue type=error]SQL Server did not accept queries within 2 minutes"
        exit 1
      displayName: 'Wait for SQL Server'
      env:
        SQL_SA_PASSWORD: $(sqlSaPassword)
  - ${{ if parameters.azurite }}:
    - bash: |
        for attempt in $(seq 1 30); do
          if (echo > /dev/tcp/127.0.0.1/10002) 2> /dev/null; then
            echo "Azurite is ready"
            exit 0
          fi
          sleep 2
        done

        docker logs atlas-azurite
        echo "##vso[task.logissue type=error]Azurite did not start within a minute"
        exit 1
      displayName: 'Wait for Azurite'

  - bash: |
      filter='${{ parameters.filter }}'
      dotnet test ${{ parameters.project }} --no-build \
        --logger trx --results-directory "$(Agent.TempDirectory)/TestResults" \
        ${filter:+--filter "$filter"}
    displayName: '${{ parameters.testRunTitle }}'
    env: ${{ parameters.env }}

  - task: PublishTestResults@2
    displayName: 'Publish test results'
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '**/*.trx'
      searchFolder: '$(Agent.TempDirectory)/TestResults'
      testRunTitle: '${{ parameters.testRunTitle }}'
